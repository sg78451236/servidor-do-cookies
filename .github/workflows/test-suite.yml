name: Test Suite

on: push

jobs:
  test:
    name: Run Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: 'npm' # Automatically caches node_modules (change to pnpm or yarn if needed)

      - name: Install dependencies
        run: npm ci # Performs a clean, deterministic install

      - name: Run tests
        run: npx vitest run # 'run' explicitly guarantees it triggers a single run and exits
